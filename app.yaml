# zorc app contract.
#
# A Zetaris-compatible read-only SQL endpoint over the four FloodSense
# contract views. It is not Zetaris; see README.md.
name: floodsense-sql
port: 8080
memory_mb: 384

domains:
  - floodsense-sql.zaindroid.me

# A dedicated Postgres holds the seed views. No AI, no cache.
database: true
redis: false
ai: false

env:
  # The bearer token the agents present. Tied to no external account, but
  # the agents need the same value, so it is supplied at deploy time rather
  # than generated where it could not be read back.
  SQL_API_KEY:
    required: true

  # The write lane on /zetaris. Absent, and that path runs reads only, which
  # is how this service shipped. A second key rather than a flag on the first:
  # read access stays something that can be handed out without consequence.
  SQL_WRITE_KEY:
    required: false

  # The real Zetaris, for the /zetaris passthrough. This node is both public
  # and on the tailnet the engine is bound to, which is the whole reason the
  # passthrough lives here. All four may be absent: those routes then answer
  # 503 and the rest of the service is unaffected.
  ZETARIS_UPSTREAM_URL:
    required: false
  ZETARIS_UPSTREAM_ORG_ID:
    required: false
  ZETARIS_UPSTREAM_USER:
    required: false
  ZETARIS_UPSTREAM_PASSWORD:
    required: false

  # The engine's own console, forwarded at /console behind UI_PASSWORD. The
  # console is writable -- it is how migrations get made -- so this password
  # is the only thing in front of it. All three absent: /console answers 503
  # and no other path changes.
  ZETARIS_UI_URL:
    required: false
  UI_USER:
    required: false
  UI_PASSWORD:
    required: false
